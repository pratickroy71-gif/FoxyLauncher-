name: Import FoxyPlayzZ Launcher Source

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-source.yml'

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FoxyLauncher repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download ZalithLauncher 1.4.1.4 source
        run: |
          rm -rf /tmp/zalith
          git clone --depth 1 --branch 141400 https://github.com/ZalithLauncher/ZalithLauncher.git /tmp/zalith
          rm -rf /tmp/zalith/.git

      - name: Copy source while excluding oversized runtime binaries
        run: |
          set -e
          rm -rf imported-source
          mkdir -p imported-source
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='jre_lwjgl3glfw/' \
            /tmp/zalith/ imported-source/

          # Keep GitHub's normal per-file limits safe. Source/config files are kept;
          # oversized prebuilt binaries are omitted because they should not live in Git.
          find imported-source -type f -size +90M -print -delete | tee oversized-files.txt || true
          printf '\nImported from ZalithLauncher tag 141400.\n' > imported-source/FOXYPLAYZZ_IMPORT.txt
          printf 'Large prebuilt runtime/native files were intentionally omitted; see oversized-files.txt.\n' >> imported-source/FOXYPLAYZZ_IMPORT.txt

      - name: Replace repository contents with imported source
        run: |
          set -e
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            -exec rm -rf {} +
          cp -a imported-source/. .
          rm -rf imported-source

      - name: Commit imported source
        run: |
          git config user.name 'FoxyPlayzZ Launcher Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'Import ZalithLauncher 1.4.1.4 source base'
          git push
